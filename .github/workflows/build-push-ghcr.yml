name: Build & Publish (single-arch to GHCR)

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: storm-cloud-plugin

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.9
      - run: ruff check run.py app plugin/
      - run: ruff format --check run.py app plugin/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - run: python -m pytest plugin/tests/ -v

  smoke:
    name: Web app boot smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # app.py / run.py are stdlib-only — import + boot need no deps. Catches
      # syntax/import/route regressions the unit tests can't (they import
      # functions, never start the server).
      - run: python -c "import app, run"
      - name: boot web app and curl /
        run: |
          python run.py web --port 8765 &
          for i in $(seq 1 40); do
            curl -fsS -o /dev/null "http://127.0.0.1:8765/" && exit 0
            sleep 0.25
          done
          echo "web app did not serve / within timeout" >&2
          exit 1

  js-check:
    name: Client JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Zero-dependency syntax check (node --check) of static/app.js and the
      # report.html inline script — no npm/eslint toolchain.
      - run: python3 scripts/check_static_js.py

  build:
    name: Build per-arch
    # PRs get fast feedback from lint/test/smoke/js-check; the image build (needs
    # the stormhub submodule and only pushes on release) runs on push-to-main
    # and release, not on every PR.
    if: github.event_name != 'pull_request'
    needs: [lint, test, smoke, js-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
            platforms: linux/amd64
            suffix: amd64
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag version
        if: github.event_name == 'release'
        id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          v="${ref#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-${{ matrix.suffix }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ steps.version.outputs.minor }}-${{ matrix.suffix }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ steps.version.outputs.major }}-${{ matrix.suffix }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest-${{ matrix.suffix }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,format=long,prefix=,suffix=-${{ matrix.suffix }}

      - name: Build & push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compute/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
